[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "prc-taxiout-2026"
version = "0.1.0"
description = "Taxi-out time prediction for the EUROCONTROL PRC Data Challenge 2026"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

# Kept to what is actually imported. The geometry stage needs a graph library
# and nothing else; numpy, pandas, pyarrow, scipy and scikit-learn were declared
# here before anything used them, which meant `pip install -e .` pulled several
# hundred megabytes to run a pipeline that imports none of it. They move in
# under `modelling` when that stage needs them.
dependencies = [
    "networkx>=3.2",
]

[project.optional-dependencies]
# The pyarrow floor is 19.0.1 because 19.0.0 cannot read the challenge files
# at all -- see the comment on `dev` below, which carries the same floor for
# the same reason.
# `holidays` is a code dependency and not a dataset: it computes each country's
# calendar from published rules, so there is nothing to fetch, nothing to cache
# and no manifest to record. It is MIT-licensed, which clears the prize rules'
# requirement on additional datasets without the question arising. The floor is
# where the country calendars this reads settled; the version the reports were
# generated with is recorded in the README beside the other data sources.
# `scikit-learn` is the one entry nothing here imports. It stays because every
# report was generated with it installed (requirements-freeze.txt records the
# version) and the container's smoke test imports it. `threadpoolctl` is
# imported by scripts/check_determinism.py, which records the BLAS thread pools;
# until it was declared here it was installed only because scikit-learn needs it.
modelling = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=19.0.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "threadpoolctl>=3",
    "catboost>=1.2",
    "lightgbm>=4.3",
    "holidays>=0.60",
]
# pandas and pyarrow are here as well as under modelling so that CI runs the
# join tests; they skip, rather than fail, where pandas is absent.
#
# pyarrow 19.0.0 raises `OSError: Repetition level histogram size mismatch` on
# every column of every challenge parquet file, from a page-index defect fixed
# in 19.0.1. Both versions were run against data/challenge/ranking.parquet to
# fix this floor rather than reading it off a changelog.
dev = ["pytest>=8.0", "ruff>=0.4", "pandas>=2.1", "pyarrow>=19.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py310"

# Stated explicitly so the lint does not drift with ruff's own defaults: a
# newer release widened them and failed CI on code that had not changed.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works on a fresh checkout with nothing installed. Without it the
# documented reproduction sequence fails at its own first test run.
pythonpath = ["src"]
